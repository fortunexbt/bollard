name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Policy checks
        run: .build/debug/BollardChecks --policy-only
      - name: Format
        run: swift format lint -r Sources Tests Package.swift
